<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="Sistema de gestión empresarial NicaTek: inventario, ventas, compras y usuarios." />
    <meta name="robots" content="noindex, nofollow" />
    <title>NicaTek · Gestión Empresarial</title>
    <script>
      // Aplica el tema ANTES del primer render para evitar el destello
      // blanco al recargar en modo oscuro. DashboardLayout mantiene esta
      // clase sincronizada despues.
      try {
        var guardado = localStorage.getItem('modoOscuro');
        var oscuro = guardado !== null
          ? guardado === 'true'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (oscuro) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) { /* localStorage bloqueado: se usa el tema claro */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
